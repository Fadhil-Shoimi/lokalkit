name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: go test ./internal/...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build
        run: wails build -platform windows/amd64 -clean
      - uses: actions/upload-artifact@v4
        with:
          name: LokalKit-windows-amd64
          path: build/bin/LokalKit.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} build/bin/LokalKit.exe --generate-notes

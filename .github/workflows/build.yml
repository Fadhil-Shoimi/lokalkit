name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: go test ./internal/...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Stamp the release version into the app (used by auto-update).
            v="${{ github.event.release.tag_name }}"
            wails build -platform windows/amd64 -clean -ldflags "-X main.AppVersion=${v#v}"
          else
            wails build -platform windows/amd64 -clean
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LokalKit-windows-amd64
          path: build/bin/LokalKit.exe
      - name: Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          # The release may already exist (published from the GitHub website); create it if not.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes --title "LokalKit $tag"
          # Checksum file lets LokalKit verify the download before updating itself.
          (cd build/bin && sha256sum LokalKit.exe > LokalKit.exe.sha256)
          gh release upload "$tag" build/bin/LokalKit.exe build/bin/LokalKit.exe.sha256 --clobber

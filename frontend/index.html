<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LokalKit</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="wordmark" role="img" aria-label="LokalKit">
        <span>L</span><svg class="wm-toggle" viewBox="4 18 56 28" aria-hidden="true"><rect x="4" y="18" width="56" height="28" rx="14" fill="#FACC15"/><circle cx="46" cy="32" r="10" fill="#15171C"/></svg><span>kalKit</span>
      </div>
      <div class="by">by Codeslab</div>
    </div>
    <div class="top-right">
      <label class="php-pick" title="PHP version">
        <span>PHP</span>
        <select id="phpSelect"></select>
      </label>
      <span class="ver" id="appVersion"></span>
    </div>
  </header>

  <main>
    <div id="fatal" class="fatal" hidden></div>

    <section class="services" id="services"></section>

    <section class="actions">
      <button class="btn primary" id="btnAll"></button>
      <button class="btn" data-act="web">🌐 Web</button>
      <button class="btn" data-act="db">🗄️ Database</button>
      <button class="btn" data-act="term">⌨️ Terminal</button>
      <button class="btn" data-act="www">📁 www</button>
      <button class="btn" data-act="mail">✉️ Mailpit</button>
      <button class="btn ghost" data-act="reload" title="Regenerate virtual hosts">↻ Reload</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="projects">Projects <span class="count" id="projCount"></span></button>
      <button class="tab" data-tab="logs">Logs</button>
      <button class="tab" data-tab="install">Install <span class="count warn" id="installCount" hidden></span></button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <section class="panel" id="tab-install" hidden>
      <p class="intro">Download what LokalKit needs from the official websites. Already have these (for example from Laragon)? You can copy them into the <button type="button" class="linkish" data-folder="bin">bin folder</button> instead.</p>
      <div id="components" class="components"></div>
      <div class="install-foot">
        <span class="muted-text" id="installHint"></span>
        <div class="ssl-btns">
          <button type="button" class="btn ghost" id="btnCancelInstall" hidden>Cancel</button>
          <button type="button" class="btn primary" id="btnInstall">Install selected</button>
        </div>
      </div>
    </section>

    <section class="panel" id="tab-projects">
      <form class="new-project" id="newProject">
        <input id="npName" placeholder="new-project-name" autocomplete="off" spellcheck="false"/>
        <select id="npKind">
          <option value="blank">Blank PHP</option>
          <option value="laravel">Laravel</option>
        </select>
        <button class="btn primary" type="submit">+ Create</button>
      </form>
      <div id="projects" class="projects"></div>
    </section>

    <section class="panel" id="tab-logs" hidden>
      <div class="log-tools">
        <button class="btn small" data-folder="logs">Open logs folder</button>
        <button class="btn small ghost" id="clearLog">Clear view</button>
      </div>
      <div id="logs" class="logs"></div>
    </section>

    <section class="panel" id="tab-settings" hidden>
      <form id="settings" class="settings">
        <fieldset>
          <legend>Ports</legend>
          <label>Apache <input type="number" name="apachePort" min="1" max="65535"/></label>
          <label>MySQL <input type="number" name="mysqlPort" min="1" max="65535"/></label>
          <label>Mailpit SMTP <input type="number" name="mailpitSmtpPort" min="1" max="65535"/></label>
          <label>Mailpit Web <input type="number" name="mailpitHttpPort" min="1" max="65535"/></label>
        </fieldset>
        <fieldset>
          <legend>Virtual host</legend>
          <label>Domain <span class="tld-wrap">project-name.<input name="tld" spellcheck="false"/></span></label>
          <label class="check"><input type="checkbox" name="autoVhost"/> Automatic virtual host for every folder in www</label>
        </fieldset>
        <fieldset>
          <legend>HTTPS (SSL)</legend>
          <label class="check"><input type="checkbox" name="ssl"/> HTTPS for every project (https://project-name.test)</label>
          <label>HTTPS port <input type="number" name="sslPort" min="1" max="65535"/></label>
          <div class="ssl-status">
            <span id="sslStatus" class="muted-text"></span>
            <div class="ssl-btns">
              <button type="button" class="btn small" id="btnTrust">Trust certificate</button>
              <button type="button" class="btn small ghost" data-folder="ssl">Certificate folder</button>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>General</legend>
          <label class="check"><input type="checkbox" name="startAllOnLaunch"/> Start all services when LokalKit opens</label>
          <label class="check"><input type="checkbox" name="minimizeToTray"/> Close button (X) hides LokalKit to the system tray</label>
          <label class="check"><input type="checkbox" name="stopAllOnExit"/> Stop all services when quitting LokalKit</label>
        </fieldset>
        <div class="settings-foot">
          <span class="muted" id="rootPath"></span>
          <button class="btn primary" type="submit">Save</button>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="./src/main.js" type="module"></script>
</body>
</html>
